<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Last 20 Surahs — Numair</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand-link js-home" href="../index.html"><span class="brand-mark">N</span><span>Home</span></a>
    <div class="stars-badge">⭐ <span id="starCount">0</span></div>
  </header>
  <main class="page">
    <h1 class="section-title">Last 20 Surahs</h1>
    <p class="section-sub">Surahs 95–114 · Listen, repeat, and memorize with Shaikh Luhaidan or Yasser Al-Dosari.</p>

    <div class="tabs">
      <button type="button" class="btn reciter-btn active" data-reciter="luhaidan">Shaikh Luhaidan</button>
      <button type="button" class="btn reciter-btn" data-reciter="dosari">Yasser Al-Dosari</button>
    </div>

    <div id="surahList" class="surah-list"></div>

    <div class="card">
      <h3 id="surahTitle">Choose a surah</h3>
      <p id="surahMeta"></p>
      <p id="audioStatus">Audio needs internet.</p>
      <div class="actions">
        <button type="button" class="btn primary" id="btnPlay">▶ Play</button>
        <button type="button" class="btn" id="btnPause">⏸ Pause</button>
        <button type="button" class="btn success" id="btnPracticed">I recited — ★</button>
      </div>
      <div id="ayahList" style="margin-top:1rem;"></div>
    </div>

    <p class="footer-note">Audio via mp3quran.net (Luhaidan & Yasser Al-Dosari). Arabic text via AlQuran Cloud API. For learning — not a printed mushaf substitute.</p>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/surahs.js"></script>
</body>
</html>

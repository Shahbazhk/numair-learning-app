<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Science — Numair</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand-link js-home" href="../index.html"><span class="brand-mark">N</span><span>Home</span></a>
    <div class="header-tools">
      <span class="grade-badge"><span class="js-grade-label">Grade 2</span></span>
      <div class="stars-badge">⭐ <span id="starCount">0</span></div>
    </div>
  </header>
  <main class="page tabbed" id="subjectRoot">
    <h1 class="section-title">Science / EVS</h1>
    <p class="section-sub" id="subjectSub">CBSE Science / EVS for your grade.</p>
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="topicsPanel">Topics</button>
      <button type="button" class="tab-btn" data-tab="playPanel">Play</button>
    </div>
    <div id="topicsPanel" class="panel active"><div data-role="learn"></div></div>
    <div id="playPanel" class="panel"><div data-role="play"></div></div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/learn-play.js"></script>
  <script>
    NumairApp.loadJSON(NumairApp.subjectHref("science.json")).done(function (data) {
      $("#subjectSub").text(
        (data.title || "Science") +
          " · CBSE Grade " +
          NumairApp.getGrade() +
          (data.depth === "outline" ? " (topic outline + quiz)" : "")
      );
      LearnPlay.mount("#subjectRoot", data, {
        activityId: NumairApp.gradeActivityId("science-quiz"),
        lang: "en-US"
      });
    });
  </script>
</body>
</html>
